
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Poudlard Social</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Georgia, serif;
      color: #f2f0ff;
      background:
        radial-gradient(ellipse at top, #26345d 0%, transparent 55%),
        linear-gradient(145deg, #080d1d, #111a32 60%, #080d1d);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 38px 30px;
      text-align: center;
      background: rgba(15, 24, 47, 0.92);
      border: 1px solid #7180ad;
      border-radius: 20px;
      box-shadow: 0 0 45px rgba(100, 125, 210, 0.16);
    }

    .crest {
      font-size: 54px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #b9c5e8;
      margin: 12px 0 28px;
      line-height: 1.6;
    }

    label {
      display: block;
      text-align: left;
      margin: 16px 0 7px;
      color: #e0e5fa;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #56658e;
      border-radius: 9px;
      background: #0b1328;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #a6b7f4;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #c7d2fe;
      color: #111a32;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e0e7ff;
    }

    .signup {
      margin-top: 23px;
      color: #c3cbea;
      line-height: 1.6;
    }

    .signup a {
      color: #e0e7ff;
      font-weight: bold;
    }

    .notice {
      margin-top: 22px;
      font-size: 12px;
      color: #94a3c9;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="login-card">
    <div class="crest">🏰</div>
    <h1>Poudlard Social</h1>
    <p class="subtitle">
   
Le monde magique se retrouve ici.<br>
Ta place à Poudlard t'attend.<br>
Deviens qui tu as envie d’être.
</p>
    <form id="login-form">
      <label for="email">Adresse hibou (e-mail)</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        placeholder="toi@exemple.fr"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        placeholder="Ton mot de passe"
        required
      >

      <button type="submit">✨ Entrer dans Poudlard</button>
      <p id="login-status" role="status"></p>
    </form>

    <p class="signup">
      Pas encore de compte ?<br>
      <a href="#inscription">Rejoindre Poudlard</a>
    </p>

  
<p class="notice">
  Une communauté magique, unie au-delà des maisons.
</p>

<section id="inscription">
  <h2>✨ Rejoindre Poudlard</h2>
  <p>Crée ton identité magique et choisis le nom de ton personnage.</p>

  <form id="signup-form">
    <label for="signup-username">Nom de ton personnage</label>
    <input
      id="signup-username"
      name="username"
      type="text"
      maxlength="30"
      autocomplete="nickname"
      placeholder="Ex. Lucie Blackhood"
      required
    >

    <label for="signup-email">Adresse e-mail</label>
    <input
      id="signup-email"
      name="signup-email"
      type="email"
      autocomplete="email"
      placeholder="toi@exemple.fr"
      required
    >

    <label for="signup-password">Mot de passe (6 caractères minimum)</label>
    <input
      id="signup-password"
      name="signup-password"
      type="password"
      minlength="6"
      autocomplete="new-password"
      required
    >

    <button type="submit">🪄 Créer mon compte</button>
    <p id="signup-status" role="status"></p>
  </form>
</section>
</main>

  
<script>
  const SUPABASE_URL = "https://znzwzozhukugrjnznlng.supabase.co";
  const SUPABASE_KEY = "sb_publishable_KfRIEetutslWHvhP4JQOfA_MiByrzMk";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("login-form");
  const status = document.getElementById("login-status");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    status.textContent = "🪄 Ouverture des portes de Poudlard...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        status.textContent =
          "Connexion impossible. Vérifie ton e-mail et ton mot de passe.";
        return;
      }

      status.textContent = "Connexion réussie !";
 window.location.href = "https://directrice-rowena.github.io/poudlard-social/accueil.html";
    } catch (error) {
      status.textContent =
        "Impossible de contacter le serveur. Réessaie plus tard.";
    }
  });
  
  const signupForm = document.getElementById("signup-form");

  signupForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const signupStatus = document.getElementById("signup-status");
    const username = document.getElementById("signup-username").value.trim();
    const email = document.getElementById("signup-email").value.trim();
    const password = document.getElementById("signup-password").value;

    if (!username) {
      signupStatus.textContent = "Choisis un nom pour ton personnage.";
      return;
    }

    signupStatus.textContent = "Création de ton compte en cours…";

    try {
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          data: { username },
          emailRedirectTo: "https://directrice-rowena.github.io/poudlard-social/"
        }
      });

    

if (error) {
  const message = error.message.toLowerCase();

  if (
    message.includes("profiles_username_unique_ci") ||
    message.includes("duplicate key") ||
    message.includes("unique constraint") ||
    message.includes("database error saving new user")
  ) {
    signupStatus.textContent =
      "Ton inscription n'a pas abouti. Ce nom est peut-être déjà pris : essaie-en un autre ! 🪄";
  } else {
    signupStatus.textContent =
      "Impossible de créer le compte : " + error.message;
  }

  return;
}


      if (data.session && data.user) {
        signupStatus.textContent =
          "Compte créé ! Bienvenue à Poudlard. ✨";
        window.location.href =
          "https://directrice-rowena.github.io/poudlard-social/accueil.html";
      } else {
        signupStatus.textContent =
          "Compte créé ! Consulte ta boîte e-mail pour confirmer ton adresse avant de te connecter.";
      }
    } catch (error) {
      signupStatus.textContent =
        "Impossible de contacter le serveur. Réessaie plus tard.";
    }
  });

</script>

</body>
</html>
